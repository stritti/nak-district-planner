# Override for docker-compose.prod.yml: use an existing Keycloak (or any OIDC
# provider) instead of the bundled one. See docs/production-compose.md.
#
#   COMPOSE_FILE=docker-compose.prod.yml:deploy/compose/existing-keycloak.yml
#
# AUTH_HOST stays required and names the existing provider's host; OIDC_* in
# .env point to it. Needs Docker Compose >= 2.24 (!override).
services:
  # Bundled Keycloak and its database only start with this profile.
  keycloak:
    profiles: [bundled-keycloak]
  keycloak-db:
    profiles: [bundled-keycloak]

  traefik:
    # Without the Keycloak routes, and without the in-stack alias for
    # AUTH_HOST: the backend must reach the real provider via DNS.
    volumes: !override
      - ./deploy/traefik/dynamic/app.yml:/etc/traefik/dynamic/app.yml:ro
      - traefik_acme:/letsencrypt
    networks: !override
      edge: {}
      app: {}

  backend:
    networks: !override
      - app
      - data
