# Development overrides — automatically merged by docker compose
#
# ENV strategy:
#   .env                    -> localhost URLs for running backend/worker on the host
#   .env.docker             -> Docker-internal app URLs for backend/worker containers
#   .env.docker.migrate     -> owner DB URL, loaded only by the migration container
#   .env.docker.test        -> test database name, loaded only by db-test
#
# Docker-specific values are loaded in docker-compose.yml. This override no longer
# duplicates runtime environment variables.
services:
  backend:
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/backend/app:/app/app
      - ./services/backend/tests:/app/tests
      - ./services/backend/alembic:/app/alembic
    ports:
      - "8000:8000"

  # Migrations run with owner credentials (POSTGRES_USER) for DDL operations
  # via `docker compose run --no-deps --rm migrate` — never inside the
  # long-running backend container.
  migrate:
    volumes:
      - ./services/backend/app:/app/app
      - ./services/backend/alembic:/app/alembic

  worker:
    command: uv run celery -A app.celery_app worker --loglevel=debug
    volumes:
      - ./services/backend/app:/app/app

  beat:
    volumes:
      - ./services/backend/app:/app/app

  # Uncomment this section to enable automatic self-update via Docker socket.
  # WARNING: Mounting the Docker socket gives the container root-equivalent access
  # to the Docker daemon. Only use in trusted environments.
  #
  # backend:
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     UPDATE_MODE: docker-socket
  #     DOCKER_COMPOSE_DIR: /app
  #
  # worker:
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     UPDATE_MODE: docker-socket
  #     DOCKER_COMPOSE_DIR: /app

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  valkey:
    ports:
      - "6379:6379"
