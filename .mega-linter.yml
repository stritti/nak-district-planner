# MegaLinter configuration
# Docs: https://megalinter.io/latest/configuration/

# ── General ──────────────────────────────────────────────────────────────────

# Validate all sources, not only the diff
VALIDATE_ALL_CODEBASE: true
# Skip the v9.5.0 release-announcement banner on PR/console reports
SECURITY_SUGGESTIONS: false
APPLY_FIXES: none
PRINT_ALPACA: false
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false

# ── Reporters ────────────────────────────────────────────────────────────────
REPORTERS:
  - consolereporter
  - githubreporter
  - githubstatusreporter

# ── Linter selection ─────────────────────────────────────────────────────────
# Enable only linters provided by the Python flavor and relevant to this repo.
# Frontend ESLint runs in the frontend CI job with the project's own config.

ENABLE_LINTERS:
  # Python security
  - PYTHON_BANDIT
  # Markup / config
  - YAML_YAMLLINT
  - JSON_JSONLINT
  # Docker
  - DOCKERFILE_HADOLINT
  # Markdown
  - MARKDOWN_MARKDOWNLINT

# ── Python ────────────────────────────────────────────────────────────────────

# Bandit — security linter for Python
PYTHON_BANDIT_FILTER_REGEX_INCLUDE: "(services/backend/app/)"
PYTHON_BANDIT_ARGUMENTS: "-r -ll"

# ── YAML ─────────────────────────────────────────────────────────────────────
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: "(megalinter-reports/|node_modules/|.venv/|uv.lock)"

# ── Dockerfile ───────────────────────────────────────────────────────────────
DOCKERFILE_HADOLINT_FILTER_REGEX_INCLUDE: "(services/)"

# ── Markdown ─────────────────────────────────────────────────────────────────
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json

# ── Global excludes ───────────────────────────────────────────────────────────
FILTER_REGEX_EXCLUDE: >-
  (\.git/|node_modules/|\.venv/|dist/|build/|coverage/|megalinter-reports/|
  services/backend/uv\.lock|services/frontend/bun\.lock)
