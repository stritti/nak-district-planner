# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # CodeQL init/analyze must use exactly the same action version in each job.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "bun" # See documentation for possible values
    directory: "/services/frontend" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "bun"
    directory: "/" # Root package.json: VitePress docs toolchain
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/services/backend" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/backend"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the Python minor version pinned in pyproject.toml and CI. A
      # new minor version lacks wheels for several dependencies (watchfiles),
      # so `uv sync --frozen` fails in the image build. Upgrade deliberately.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/" # docker-compose*.yml live in the repository root
    schedule:
      interval: "weekly"
