name: Refresh lockfile for 470
on:
  push:
    branches: [fix/470-sync-reliability]
    paths: [.github/workflows/lockfile-470.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
        working-directory: services/backend
      - name: Push refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend/uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh celery redis lockfile (#470)"
            git push
          fi
