name: SPDX one-off migration
on:
  push:
    branches:
      - chore/spdx-copyright-headers
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply SPDX migration
        run: |
          python3 scripts/license_headers.py --fix
          python3 scripts/license_headers.py --check
          python3 -m unittest discover -s scripts -p 'test_license_headers.py' -v
      - name: Commit attribution changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore(license): finish SPDX attribution for remaining sources"
            git push origin HEAD:chore/spdx-copyright-headers
          fi
