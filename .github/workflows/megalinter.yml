name: MegaLinter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required when PRs validate only their diff.
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PRs only need to validate changed files because main/develop are
          # fully validated after merge. Pushes keep the full-codebase gate.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}
          DEFAULT_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
          # Do not auto-apply fixes — just report
          APPLY_FIXES: none
          # Post a summary comment on PRs
          MEGALINTER_CONFIG: .mega-linter.yml

      - name: Archive MegaLinter reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/
          retention-days: 7
