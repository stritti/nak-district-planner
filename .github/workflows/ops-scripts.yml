name: ops-scripts

# Lint and test the operator tooling in scripts/ops/ (nakctl, nakops.py).
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/ops/**'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - '.github/workflows/ops-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/**'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - '.github/workflows/ops-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ops scripts — ShellCheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: nak
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: nakctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nak -d nakctl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck -x scripts/ops/nakctl scripts/ops/lib.sh scripts/ops/examples/*.sh

      - name: Install Valkey/Redis server and PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server redis-tools postgresql-client
          sudo systemctl stop redis-server || true

      - name: Unit and behaviour tests
        env:
          NAKCTL_TEST_PSQL_DSN: postgresql://nak:changeme@localhost:5432/nakctl_test
        run: python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v
