name: Validate Docker Images

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'services/backend/Dockerfile'
              - 'services/backend/**'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - '.github/workflows/build.yml'
            frontend:
              - 'services/frontend/Dockerfile'
              - 'services/frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - '.github/workflows/build.yml'

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Compose environment
        run: cp .env.example .env && cp .env.db.example .env.db

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        env:
          APP_VERSION: 0.0.0-ci
          APP_HOST: planer.example.org
          AUTH_HOST: auth.example.org
          ACME_EMAIL: ops@example.org
          KEYCLOAK_ADMIN_ALLOWED_IPS: 192.0.2.0/24
        run: |
          cp .env.keycloak.example .env.keycloak
          cp .env.keycloak-db.example .env.keycloak-db
          docker compose -f docker-compose.prod.yml config --quiet
          # Variants with an existing Traefik and/or Keycloak on the host
          for overrides in existing-keycloak existing-traefik "existing-keycloak existing-traefik"; do
            args=(-f docker-compose.prod.yml)
            for o in $overrides; do args+=(-f "deploy/compose/$o.yml"); done
            docker compose "${args[@]}" config --quiet
          done

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true
