name: Security Scans

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Python and JavaScript/TypeScript are interpreted languages. CodeQL
      # extracts them directly, so an autobuild step would only add overhead.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  pip-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject committed environment backup files
        run: |
          matches="$(git -C "$GITHUB_WORKSPACE" ls-files | grep -E '(^|/)\.env(\.[^/]+)?\.bak$|(^|/)[^/]+\.env\.bak$' || true)"
          if [[ -n "$matches" ]]; then
            echo "::error::Tracked environment backup files are forbidden"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: |
            services/backend/pyproject.toml
            services/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"

      - name: Export requirements for audit
        run: uv export --format requirements-txt --no-dev --no-emit-project -o /tmp/requirements-audit.txt

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: /tmp/requirements-audit.txt

  npm-audit:
    name: Frontend Dependency Audit (bun audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # bun audit was introduced in Bun 1.3 and reads dependency data directly
      # from bun.lock. Installing node_modules first is therefore redundant.
      - name: Audit frontend dependencies
        run: bun audit --audit-level=moderate

  kics:
    name: IaC Scan (KICS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Secrets live in .env files; compose files only reference ${...}
      # variables, so the secrets regexes would only match false positives.
      # .github/workflows is CI configuration, not deployment IaC.
      - name: Run KICS scan on IaC files
        uses: checkmarx/kics-github-action@4a16c2130b02104dc2624c133d5224080e7cc49b # v2.2.1
        with:
          path: .
          exclude_paths: ".github/**"
          disable_secrets: true
          fail_on: high
          output_formats: json,sarif
          output_path: kics-results
          output_name: kics-report

      - name: Upload KICS results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: kics-results/kics-report.sarif
          category: kics

      - name: Archive KICS report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kics-report
          path: kics-results/
          retention-days: 7
