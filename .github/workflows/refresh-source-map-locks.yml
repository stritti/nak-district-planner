name: Refresh source-map-js lockfiles

on:
  push:
    branches:
      - fix/source-map-js-1.2.2

permissions:
  contents: read
  actions: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Update vulnerable transitive dependency
        run: |
          bun update source-map-js --lockfile-only
          bun update source-map-js --lockfile-only --cwd services/frontend
          bun update source-map-js --lockfile-only --cwd docs

      - name: Verify dependency audit
        run: bun audit --audit-level=moderate

      - name: Upload regenerated lockfiles
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-map-js-lockfiles
          path: |
            bun.lock
            services/frontend/bun.lock
            docs/bun.lock
          if-no-files-found: error
