services:
  backend:
    build: ./services/backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # Use nak_app role for RLS enforcement in production
      DATABASE_URL: "postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}"

  # One-shot migration runner. Alembic needs the database owner for DDL
  # (roles, tables, SECURITY DEFINER functions — see revisions 0016/0017).
  # Owner credentials are deliberately NOT exposed to the long-running
  # backend/worker services: run migrations explicitly via
  # `docker compose run --no-deps --rm migrate`.
  migrate:
    build: ./services/backend
    env_file: .env
    command: uv run alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    profiles:
      - tools

  worker:
    build: ./services/backend
    command: uv run celery -A app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      # Use nak_app role for RLS enforcement in production
      DATABASE_URL: "postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}"

  frontend:
    build: ./services/frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    # NOTE: PG18+ requires mount at /var/lib/postgresql (not /data) so it can
    # create a major-version-specific subdirectory (e.g. 18/data) internally.
    # This enables future pg_upgrade --link across major versions.
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: nak_planner_test
    volumes:
      - ./postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nak_planner_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - ./valkey_data:/data
