services:
  backend:
    build: ./services/backend
    env_file:
      - .env
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # One-shot migration runner. Alembic needs the database owner for DDL
  # (roles, tables, SECURITY DEFINER functions — see revisions 0016/0017).
  # The owner password lives in .env.db, which only db, db-test and migrate
  # load; runtime services never receive it. They start only after this
  # one-shot deployment step completed.
  migrate:
    build: ./services/backend
    env_file:
      - .env
      - .env.db
      - .env.docker.migrate
    command: uv run alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./services/backend
    command: uv run celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped

  # The only scheduler for celery_app.beat_schedule. Run exactly one instance:
  # every additional replica would fire each periodic job again. The schedule
  # file (last run times) lives on a named volume so restarts do not re-run or
  # skip jobs. Runtime credentials only (.env + .env.docker), like the worker.
  beat:
    build: ./services/backend
    command: uv run celery -A app.celery_app beat --loglevel=info --schedule /app/beat/celerybeat-schedule
    env_file:
      - .env
      - .env.docker
    volumes:
      - beat_schedule:/app/beat
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    # The application-facing nginx is intentionally reachable only from the
    # host loopback interface. Public TLS termination belongs to the external
    # reverse proxy; this prevents bypassing HTTPS via the server IP while
    # preserving the documented reverse-proxy target on 127.0.0.1:80.
    ports:
      - "127.0.0.1:80:80"
    env_file:
      - .env.docker.frontend
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  db:
    # NOTE: PG18+ requires mount at /var/lib/postgresql (not /data) so it can
    # create a major-version-specific subdirectory (e.g. 18/data) internally.
    # This enables future pg_upgrade --link across major versions.
    image: postgres:18.6-alpine
    env_file:
      - .env
      - .env.db
    volumes:
      - ./postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local test database only; never part of a normal `up`.
  # Start explicitly: docker compose --profile test up -d db-test
  db-test:
    image: postgres:18.6-alpine
    profiles: [test]
    env_file:
      - .env
      - .env.db
      - .env.docker.test
    volumes:
      - ./postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nak_planner_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9.1.2-alpine
    volumes:
      - ./valkey_data:/data
    restart: unless-stopped

volumes:
  beat_schedule:
