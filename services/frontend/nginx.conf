# Keep the scheme reported by the external TLS proxy; fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Restore the real client IP from X-Forwarded-For, but only for hops from
    # trusted proxies (set_real_ip_from lines generated from NGINX_REAL_IP_FROM
    # by 15-real-ip-from.sh). $remote_addr is then the real client.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Look the backend up again through Docker's embedded DNS instead of once at
    # start. With a literal `proxy_pass http://backend:8000` nginx keeps the IP
    # the backend had when nginx started; after the backend container is
    # recreated (deploy, `up --force-recreate backend`) every request answers
    # 502 until this container is restarted too. A variable in proxy_pass makes
    # nginx resolve the name at request time via the resolver (cached 10s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Proxy the dependency-aware backend health response instead of the SPA fallback
    location = /health {
        proxy_pass $backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sanitized: never forward the client-supplied chain to the backend.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA routing: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sanitized: never forward the client-supplied chain to the backend.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Browser security headers. HSTS is intentionally configured at the public
    # TLS reverse proxy because this internal nginx only serves plain HTTP.
    # The SPA talks to backend APIs through this same origin; OAuth redirects are
    # top-level navigations and therefore do not require a broad connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
